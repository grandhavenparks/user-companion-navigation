name: edge_forestry_mobile
description: User Navigation Companion - offline-first field navigation to flagged points inside bundled park boundaries.
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter

  # State
  flutter_riverpod: ^2.6.1

  # Map: flutter_map + Protomaps vector tiles rendered on the device.
  flutter_map: ^8.2.2
  latlong2: ^0.10.1
  # Pinned: newest flutter_map 8 compatible release (includes the raster-mode
  # memory leak fixes from beta.12 and the blank-tile fix from beta.13).
  vector_map_tiles: 9.0.0-beta.13
  vector_tile_renderer: ^6.1.0

  # Device
  geolocator: ^14.1.1
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  path: ^1.9.1
  file_picker: ^13.1.0
  share_plus: ^13.3.0
  shared_preferences: ^2.5.3
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - parks/
    - assets/map/
